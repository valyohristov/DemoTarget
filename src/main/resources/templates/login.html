<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width:420px;">
    <h1 class="h3 mb-4 text-center">Demo target — sign in</h1>
    <div th:if="${param.error}" class="alert alert-danger">Invalid email or password.</div>
    <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>
    <p class="text-muted small">Try <strong>admin@example.com</strong> (sees all routes) or
        <strong>alex.rivera@example.com</strong> / <strong>jordan.lee@example.com</strong> (location-scoped). Password for all: <strong>password</strong>.</p>
    <form th:action="@{/login}" method="post" class="card shadow-sm">
        <div class="card-body p-4">
            <div th:replace="~{fragments/csrf :: csrfInput}"></div>
            <div class="mb-3">
                <label class="form-label" for="username">Email</label>
                <input class="form-control" id="username" name="username" type="email" autocomplete="username" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign in</button>
        </div>
    </form>
</div>
</body>
</html>
