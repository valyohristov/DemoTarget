<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vehicles</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container-fluid mt-4 px-5">
    <h1 class="mb-4 text-center">Vehicles</h1>
    <div th:replace="~{fragments/nav :: nav ('vehicles')}"></div>
    <div class="d-flex justify-content-end mb-3">
        <a th:if="${perm.vehiclesWrite}" th:href="@{/vehicles/add}" class="btn btn-success">Add vehicle</a>
    </div>
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <p th:if="${!perm.vehiclesWrite}" class="text-muted small">You have read-only access to vehicles.</p>
            <table class="table table-striped table-bordered mb-0">
                <thead class="table-light">
                <tr>
                    <th style="width:80px;">ID</th>
                    <th>Identifier</th>
                    <th>Description</th>
                    <th th:if="${perm.vehiclesWrite}" class="text-end pe-4" style="width:220px;">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="v : ${vehicles}">
                    <td th:text="${v.id}"></td>
                    <td th:text="${v.identifier}"></td>
                    <td th:text="${v.description}"></td>
                    <td th:if="${perm.vehiclesWrite}" class="actions d-flex justify-content-end gap-2 pe-4">
                        <a th:href="@{/vehicles/edit/{id}(id=${v.id})}" class="btn btn-warning btn-sm">Edit</a>
                        <a th:href="@{/vehicles/delete/{id}(id=${v.id})}" class="btn btn-danger btn-sm"
                           onclick="return confirm('Delete this vehicle?')">Delete</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(vehicles)}">
                    <td th:colspan="${perm.vehiclesWrite ? 4 : 3}" class="text-center text-muted">No vehicles yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
