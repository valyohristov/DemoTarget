<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${mode == 'add'} ? 'Add assignment' : 'Edit assignment'">Assignment</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4" th:text="${mode == 'add'} ? 'Add assignment' : 'Edit assignment'">Assignment</h1>
    <div th:replace="~{fragments/nav :: nav ('assignments')}"></div>

    <form th:action="${mode == 'add'} ? @{/assignments/add} : @{/assignments/edit/{id}(id=${form.id})}"
          th:object="${form}" method="post" class="card shadow-sm mt-3">
        <div class="card-body p-4">
            <div th:replace="~{fragments/csrf :: csrfInput}"></div>
            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label" for="routeId">Route</label>
                    <select class="form-select" id="routeId" th:field="*{routeId}" required>
                        <option value="" disabled th:selected="*{routeId} == null">Select route…</option>
                        <option th:each="r : ${routes}" th:value="${r.id}"
                                th:text="${r.name + (r.startLocation != null ? ' (' + r.startLocation.name + ')' : '')}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="personId">Person</label>
                    <select class="form-select" id="personId" th:field="*{personId}" required>
                        <option value="" disabled th:selected="*{personId} == null">Select person…</option>
                        <option th:each="p : ${persons}" th:value="${p.id}"
                                th:text="${p.fullName + ' (' + p.email + ')'}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="vehicleId">Vehicle</label>
                    <select class="form-select" id="vehicleId" th:field="*{vehicleId}" required>
                        <option value="" disabled th:selected="*{vehicleId} == null">Select vehicle…</option>
                        <option th:each="v : ${vehicles}" th:value="${v.id}" th:text="${v.identifier}"></option>
                    </select>
                </div>
            </div>
            <div class="d-flex justify-content-end mt-4">
                <button type="submit" class="btn btn-success me-2">Save</button>
                <a th:href="@{/assignments}" class="btn btn-primary">Cancel</a>
            </div>
        </div>
    </form>
</div>
</body>
</html>
