<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Route · Person · Vehicle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container-fluid mt-4 px-5">
    <h1 class="mb-4 text-center">Demo target — combined assignments</h1>
    <div th:replace="~{fragments/nav :: nav ('assignments')}"></div>
    <div class="d-flex justify-content-end mb-3">
        <a th:if="${perm.assignmentsWrite}" th:href="@{/assignments/add}" class="btn btn-success">Add row</a>
    </div>
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <p class="text-muted small mb-3">Table <code>route_person_vehicle</code>: each row links one route, one person, and one vehicle.</p>
            <p th:if="${perm.assignmentsRead and !perm.assignmentsWrite}" class="text-muted small">You can view assignments but not change them.</p>
            <table class="table table-striped table-bordered mb-0">
                <thead class="table-light">
                <tr>
                    <th style="width:80px;">ID</th>
                    <th>Route</th>
                    <th>Person</th>
                    <th>Vehicle</th>
                    <th th:if="${perm.assignmentsWrite}" class="text-end pe-4" style="width:220px;">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${rows}">
                    <td th:text="${row.id}"></td>
                    <td>
                        <span th:text="${row.route.name}">Route</span>
                        <span th:if="${row.route.startLocation != null}" class="text-muted small"
                              th:text="${' · from ' + row.route.startLocation.name}"></span>
                    </td>
                    <td th:text="${row.person.fullName + ' (' + row.person.email + ')'}"></td>
                    <td th:text="${row.vehicle.identifier}"></td>
                    <td th:if="${perm.assignmentsWrite}" class="actions d-flex justify-content-end gap-2 pe-4">
                        <a th:href="@{/assignments/edit/{id}(id=${row.id})}" class="btn btn-warning btn-sm">Edit</a>
                        <a th:href="@{/assignments/delete/{id}(id=${row.id})}" class="btn btn-danger btn-sm"
                           onclick="return confirm('Delete this row?')">Delete</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(rows)}">
                    <td th:colspan="${perm.assignmentsWrite ? 5 : 4}" class="text-center text-muted">No rows yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
