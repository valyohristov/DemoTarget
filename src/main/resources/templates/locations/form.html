<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${mode == 'add'} ? 'Add location' : 'Edit location'">Location</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4" th:text="${mode == 'add'} ? 'Add location' : 'Edit location'">Location</h1>
    <div th:replace="~{fragments/nav :: nav ('locations')}"></div>
    <form th:action="${mode == 'add'} ? @{/locations/add} : @{/locations/edit/{id}(id=${location.id})}"
          th:object="${location}" method="post" class="card shadow-sm mt-3">
        <div class="card-body p-4">
            <div class="mb-3">
                <label class="form-label" for="name">Name</label>
                <input class="form-control" id="name" th:field="*{name}" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="description">Description</label>
                <textarea class="form-control" id="description" th:field="*{description}" rows="3"></textarea>
            </div>
            <div class="d-flex justify-content-end mt-4">
                <button type="submit" class="btn btn-success me-2">Save</button>
                <a th:href="@{/locations}" class="btn btn-primary">Cancel</a>
            </div>
        </div>
    </form>
</div>
</body>
</html>
