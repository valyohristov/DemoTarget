<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Locations</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container-fluid mt-4 px-5">
    <h1 class="mb-4 text-center">Locations</h1>
    <div th:replace="~{fragments/nav :: nav ('locations')}"></div>
    <div class="d-flex justify-content-end mb-3">
        <a th:if="${perm.locationsWrite}" th:href="@{/locations/add}" class="btn btn-success">Add location</a>
    </div>
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <p th:if="${!perm.locationsWrite}" class="text-muted small">You have read-only access to locations.</p>
            <table class="table table-striped table-bordered mb-0">
                <thead class="table-light">
                <tr>
                    <th style="width:80px;">ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th th:if="${perm.locationsWrite}" class="text-end pe-4" style="width:220px;">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="loc : ${locations}">
                    <td th:text="${loc.id}"></td>
                    <td th:text="${loc.name}"></td>
                    <td th:text="${loc.description}"></td>
                    <td th:if="${perm.locationsWrite}" class="actions d-flex justify-content-end gap-2 pe-4">
                        <a th:href="@{/locations/edit/{id}(id=${loc.id})}" class="btn btn-warning btn-sm">Edit</a>
                        <a th:href="@{/locations/delete/{id}(id=${loc.id})}" class="btn btn-danger btn-sm"
                           onclick="return confirm('Delete this location? Routes using it will clear start location.')">Delete</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(locations)}">
                    <td th:colspan="${perm.locationsWrite ? 4 : 3}" class="text-center text-muted">No locations yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
