<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Persons</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container-fluid mt-4 px-5">
    <h1 class="mb-4 text-center">Persons</h1>
    <div th:replace="~{fragments/nav :: nav ('persons')}"></div>
    <div class="d-flex justify-content-end mb-3">
        <a th:href="@{/persons/add}" class="btn btn-success">Add person</a>
    </div>
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <table class="table table-striped table-bordered mb-0">
                <thead class="table-light">
                <tr>
                    <th style="width:80px;">ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th class="text-end pe-4" style="width:200px;">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${persons}">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.fullName}"></td>
                    <td th:text="${p.email}"></td>
                    <td class="actions d-flex justify-content-end gap-2 pe-4">
                        <a th:href="@{/persons/edit/{id}(id=${p.id})}" class="btn btn-warning btn-sm">Edit</a>
                        <a th:href="@{/persons/delete/{id}(id=${p.id})}" class="btn btn-danger btn-sm"
                           onclick="return confirm('Delete this person?')">Delete</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(persons)}">
                    <td colspan="4" class="text-center text-muted">No persons yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
