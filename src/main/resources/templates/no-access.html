<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Access denied</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <div th:replace="~{fragments/nav :: nav ('assignments')}"></div>
    <div class="alert alert-warning mt-3">
        <h1 class="h4">No access</h1>
        <p class="mb-0" th:text="${message} ?: 'You do not have permission for this area.'">You do not have permission.</p>
    </div>
    <a th:href="@{/assignments}" class="btn btn-primary">Back to assignments</a>
</div>
</body>
</html>
