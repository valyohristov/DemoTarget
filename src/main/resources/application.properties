spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.url=jdbc:mysql://192.168.1.58:3306/DemoTarget?allowPublicKeyRetrieval=true
spring.datasource.username=ownidm
spring.datasource.password=ownidm
#spring.datasource.url=jdbc:mysql://localhost:3306/demo_target
#spring.datasource.username=root
#spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Allow Flyway to start against a non-empty schema with no history table.
# Keep baseline-version aligned with the latest migration so a re-baseline
# doesn't accidentally skip migrations that haven't actually been applied.
# Bump this whenever a new V<N> is added.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=6

spring.sql.init.mode=never

spring.mvc.date-format=yyyy-MM-dd

spring.thymeleaf.cache=false
server.port=8090
